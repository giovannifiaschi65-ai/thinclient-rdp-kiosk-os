name: Build Thin Client RDP ISO

on:
  workflow_dispatch:
    inputs:
      default_server:
        description: "Indirizzo Server Windows predefinito (opzionale, lascia vuoto per maschera pulita)"
        required: false
        default: ""
        type: string
      default_domain:
        description: "Dominio Windows predefinito (opzionale)"
        required: false
        default: ""
        type: string
      default_user:
        description: "Nome Utente Windows predefinito (opzionale)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-iso:
    name: Compila ISO Ibrida BIOS + UEFI (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calcola versione YYMMDDHHMM (fuso orario Europe/Rome)
        run: |
          VER="$(TZ=Europe/Rome date +%y%m%d%H%M)"
          ISO="thinclient-rdp-kiosk-${VER}.iso"
          echo "BUILD_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "ISO_NAME=${ISO}" >> "$GITHUB_ENV"
          echo "Versione ISO assegnata: ${VER} (${ISO})"

      - name: Libera spazio disco opzionale sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Installa dipendenze di compilazione ISO
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\nFallbackDNS=9.9.9.9\n' | sudo tee /etc/systemd/resolved.conf.d/99-public-dns.conf
          sudo systemctl restart systemd-resolved || true
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' "https://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://mirrors.edge.kernel.org/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|https://mirrors.edge.kernel.org/ubuntu/|g; s|http://security.ubuntu.com/ubuntu/|https://mirrors.edge.kernel.org/ubuntu/|g; s|https://security.ubuntu.com/ubuntu/|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-common \
            grub2-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin \
            mtools \
            dosfstools \
            fdisk \
            rsync \
            python3-cairo

      - name: Applica eventuali parametri opzionali da workflow_dispatch
        env:
          INPUT_SERVER: ${{ inputs.default_server }}
          INPUT_DOMAIN: ${{ inputs.default_domain }}
          INPUT_USER: ${{ inputs.default_user }}
        run: |
          if [ -n "${INPUT_SERVER}" ]; then
            sed -i "s|^default_server =.*|default_server = ${INPUT_SERVER}|" overlay/etc/rdp-kiosk/kiosk.conf
          fi
          if [ -n "${INPUT_DOMAIN}" ]; then
            sed -i "s|^default_domain =.*|default_domain = ${INPUT_DOMAIN}|" overlay/etc/rdp-kiosk/kiosk.conf
          fi
          if [ -n "${INPUT_USER}" ]; then
            sed -i "s|^default_user =.*|default_user = ${INPUT_USER}|" overlay/etc/rdp-kiosk/kiosk.conf
          fi

      - name: Verifica preliminare rapida xorriso + EFI snello + tema Cairo
        run: |
          python3 -m py_compile overlay/usr/local/bin/rdp-kiosk-ui overlay/usr/local/sbin/rdp-net-helper overlay/usr/local/sbin/rdp-bt-helper build/generate-plymouth-assets.py
          bash -n build/build-iso.sh overlay/usr/local/bin/kiosk-tty-launcher overlay/usr/local/bin/kiosk-xsession overlay/usr/local/sbin/rdp-power-action overlay/usr/local/sbin/rdp-sync-netconfig overlay/usr/local/sbin/rdp-install-disk overlay/usr/local/sbin/rdp-save-target overlay/usr/local/sbin/rdp-load-config overlay/usr/local/sbin/kiosk-usb-mount overlay/usr/local/sbin/kiosk-printer-autoconfig
          TMP_TEST="$(mktemp -d)"
          python3 build/generate-plymouth-assets.py "${TMP_TEST}/plymouth" "${BUILD_VERSION}"
          ls -lh "${TMP_TEST}/plymouth"
          mkdir -p "${TMP_TEST}/iso/boot/grub" "${TMP_TEST}/iso/EFI/BOOT"
          echo "set timeout=1" > "${TMP_TEST}/iso/boot/grub/grub.cfg"
          echo "configfile /boot/grub/grub.cfg" > "${TMP_TEST}/chain.cfg"
          GRUB_EFI_MODS="normal configfile search search_fs_file search_fs_uuid search_label part_gpt part_msdos fat exfat ntfs iso9660 ext2 loopback gzio xzio linux all_video efi_gop efi_uga video_bochs video_cirrus video video_fb gfxterm gfxmenu font png halt reboot test echo true sleep ls cat"
          grub-mkstandalone -O x86_64-efi --modules="${GRUB_EFI_MODS}" --locales="" --themes="" --fonts="unicode" -o "${TMP_TEST}/iso/EFI/BOOT/BOOTX64.EFI" "boot/grub/grub.cfg=${TMP_TEST}/chain.cfg"
          ls -lh "${TMP_TEST}/iso/EFI/BOOT/BOOTX64.EFI"
          dd if=/dev/zero of="${TMP_TEST}/cfg.img" bs=1M count=8 status=none
          mkfs.ext4 -F -b 1024 -O ^has_journal,^metadata_csum_seed -L RDPOS_CFG "${TMP_TEST}/cfg.img" >/dev/null
          grub-mkrescue --locales="" --themes="" --fonts="unicode" -o "${TMP_TEST}/test.iso" "${TMP_TEST}/iso" -- \
            -volid "THINCLIENT_RDP" \
            -append_partition 3 0x83 "${TMP_TEST}/cfg.img"
          fdisk -l "${TMP_TEST}/test.iso"
          rm -rf "${TMP_TEST}"

      - name: Compila immagine ISO Thin Client RDP
        run: |
          sed -i 's/\r$//' build/build-iso.sh
          chmod +x build/build-iso.sh
          sudo BUILD_VERSION="${BUILD_VERSION}" ISO_NAME="${ISO_NAME}" ./build/build-iso.sh

      - name: Verifica struttura di avvio BIOS + UEFI dell'ISO
        run: |
          ls -lh output/
          fdisk -l "output/${ISO_NAME}"
          xorriso -indev "output/${ISO_NAME}" -report_el_torito plain

      - name: Carica Artifact ISO pronto per Rufus / BalenaEtcher
        uses: actions/upload-artifact@v4
        with:
          name: thinclient-rdp-kiosk-${{ env.BUILD_VERSION }}-iso
          path: |
            output/${{ env.ISO_NAME }}
            output/${{ env.ISO_NAME }}.sha256
          compression-level: 0
          retention-days: 30

      - name: Pubblica GitHub Release (${{ env.BUILD_VERSION }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: Thin Client RDP Kiosk — ${{ env.BUILD_VERSION }}
          files: |
            output/${{ env.ISO_NAME }}
            output/${{ env.ISO_NAME }}.sha256
          generate_release_notes: true
