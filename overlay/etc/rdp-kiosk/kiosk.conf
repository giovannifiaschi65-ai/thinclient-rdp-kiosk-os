# Configurazione Thin Client RDP Kiosk
# L'indirizzo del Server Windows (e l'eventuale Dominio) inserito nella maschera
# viene memorizzato automaticamente in "rdp-kiosk.conf" sulla partizione di avvio.

[kiosk]
# Titolo mostrato nell'intestazione della maschera Kiosk
title = Postazione Thin Client RDP

# Sottotitolo informativo mostrato sotto il titolo principale
subtitle = Inserisci le credenziali per accedere al Server Windows

# Server Windows predefinito (aggiornato automaticamente al primo collegamento)
default_server =

# Dominio Windows predefinito (opzionale, aggiornato automaticamente)
default_domain =

# Se impostato a false (predefinito), Server e Dominio restano memorizzati
# mentre Utente e Password vengono sempre cancellati alla disconnessione.
clear_all_on_disconnect = false

# Argomenti aggiuntivi opzionali per FreeRDP (separati da spazio)
extra_freerdp_args =
