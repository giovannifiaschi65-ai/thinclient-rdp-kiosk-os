# Configurazione Thin Client RDP Kiosk
# Indirizzo Server Windows, Dominio e Nome Utente inseriti nella maschera
# vengono memorizzati automaticamente sia su Disco Interno sia su Chiavetta USB Rufus.

[kiosk]
# Titolo mostrato nell'intestazione della maschera Kiosk
title = Postazione Thin Client RDP

# Sottotitolo informativo mostrato sotto il titolo principale
subtitle = Inserisci le credenziali per accedere al Server Windows

# Valori memorizzati automaticamente al collegamento
default_server =
default_domain =
default_user =

# Se impostato a false (predefinito), Server, Dominio e Utente restano memorizzati
# mentre la Password viene sempre cancellata alla disconnessione.
clear_all_on_disconnect = false

# Condivisione automatica periferiche locali nella sessione Windows Server
enable_usb_drives = true
enable_printers = true
enable_smartcard = true
enable_webcam = true
enable_microphone = true

# Argomenti aggiuntivi opzionali per FreeRDP (separati da spazio)
extra_freerdp_args =
