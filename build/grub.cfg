set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2

set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

menuentry "Avvia Thin Client RDP (Modalita Kiosk)" {
    search --no-floppy --set=root --file /live/filesystem.squashfs
    linux /boot/vmlinuz boot=live components noeject quiet loglevel=3 locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome
    initrd /boot/initrd.img
}

menuentry "Avvia Thin Client RDP (Compatibilita Video - nomodeset)" {
    search --no-floppy --set=root --file /live/filesystem.squashfs
    linux /boot/vmlinuz boot=live components noeject quiet nomodeset locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome
    initrd /boot/initrd.img
}

menuentry "Installa Thin Client RDP su Disco Interno" {
    search --no-floppy --set=root --file /live/filesystem.squashfs
    linux /boot/vmlinuz boot=live components noeject loglevel=3 rdp.install=1 locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome
    initrd /boot/initrd.img
}

menuentry "Spegni il Computer" {
    halt
}
