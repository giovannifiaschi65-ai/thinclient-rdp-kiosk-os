set default=0
set timeout=4

insmod all_video
insmod gfxterm
insmod font
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=1024x768x32,auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

menuentry "Avvia Thin Client RDP (Modalita Kiosk)" {
    set gfxpayload=keep
    search --no-floppy --set=root --file /live/filesystem.squashfs
    linux /boot/vmlinuz boot=live components noeject quiet splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 loglevel=3 locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome
    initrd /boot/initrd.img
}

menuentry "Avvia Thin Client RDP (Compatibilita Video - nomodeset)" {
    set gfxpayload=keep
    search --no-floppy --set=root --file /live/filesystem.squashfs
    linux /boot/vmlinuz boot=live components noeject quiet splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 nomodeset locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome
    initrd /boot/initrd.img
}

menuentry "Installa Thin Client RDP su Disco Interno" {
    search --no-floppy --set=root --file /live/filesystem.squashfs
    linux /boot/vmlinuz boot=live components noeject loglevel=3 rdp.install=1 locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome
    initrd /boot/initrd.img
}

menuentry "Spegni il Computer" {
    halt
}
